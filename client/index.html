    <!-- חיבור מוקדם ל-CDN של Cloudinary (תמונות מוצר) - אותו origin קבוע
         לכל חשבון (שם הענן הוא segment בנתיב, לא בדומיין), אז אין צורך
         בסקריפט תלוי-env כמו למטה. אם אין תמונות ב-Cloudinary בכלל
         (fallback ל-data URL) - החיבור הזה פשוט לא נוצל, בלי עלות ממשית. -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!--
      חיבור מוקדם לשרת ה-API והסוקט — רץ לפני טעינת ה-bundle כדי שה-TCP/TLS
      handshake יתחיל בזמן שה-JS עדיין נטען. הקוד המקביל ב-main.tsx רץ מאוחר
      מדי (אחרי הערכת ה-bundle) ולא מספיק לבקשה הראשונה של checkAuth.
      (אין כאן יותר ping ל-/health - השרת רץ על tier בתשלום שתמיד ער,
      אין sleep/cold-start להתמודד איתו יותר. ה-preconnect לבדו מספיק.)
      %VITE_API_URL% ו-%VITE_SOCKET_URL% מוחלפים ע"י Vite בזמן build;
      בפיתוח מקומי ללא הגדרת env — הסקריפט יוצא בשקט.
    -->
    <script>
      (function () {
        function addPreconnect(url) {
          if (!url || url.charAt(0) === '%') return;
          try {
            var origin = new URL(url).origin;
            if (document.querySelector('link[rel="preconnect"][href="' + origin + '"]')) return;
            var link = document.createElement('link');
            link.rel = 'preconnect';
            link.href = origin;
            link.crossOrigin = 'anonymous';
            document.head.appendChild(link);
            var dns = document.createElement('link');
            dns.rel = 'dns-prefetch';
            dns.href = origin;
            document.head.appendChild(dns);
          } catch (e) { /* URL לא תקין — מתעלמים */ }
        }
        addPreconnect('%VITE_API_URL%');
        addPreconnect('%VITE_SOCKET_URL%');
      })();
    </script>
  <!--
    גובה חלון אמיתי כ-CSS variable (--app-height).
    ב-Chrome ל-iOS (וגם Safari) היחידות 100dvh/100vh מחושבות לא נכון - המסך
    יוצא חתוך מלמטה (הבר התחתון מוסתר מאחורי סרגל הדפדפן, או פס ריק).
    window.innerHeight תמיד = האזור הנראה בפועל. רץ ב-<head> כדי שהערך ייקבע
    לפני הצביעה הראשונה. מתעלמים מ-resize בזמן ששדה קלט ממוקד (מקלדת
    וירטואלית). fallback ל-100dvh למקרה שהסקריפט לא רץ.
  -->
  <script>
    (function () {
      var d = document.documentElement;
      var vv = window.visualViewport;
      var raf = 0;
      function set() {
        var a = document.activeElement;
        if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable)) return;
        // האזור הנראה בפועל = visualViewport.height (מתכווץ כשסרגלי הדפדפן
        // פתוחים). innerHeight ב-iOS הוא הגודל ה"גדול" הקבוע - לא מתאים.
        var visible = (vv && vv.height) ? vv.height : (window.innerHeight || d.clientHeight);
        if (visible > 0) d.style.setProperty('--app-height', Math.round(visible) + 'px');
        // --nav-bottom = גובה סרגל הדפדפן שמתחת לאזור הנראה. הבר התחתון
        // (position:fixed) יושב ב-bottom: var(--nav-bottom) כדי לא להיחתך
        // מאחוריו ב-iOS. 0 ב-PWA/דסקטופ/כשהסרגל מוסתר בגלילה.
        if (vv) {
          var layoutH = window.innerHeight || d.clientHeight;
          var nb = Math.max(0, Math.round(layoutH - vv.height - vv.offsetTop));
          d.style.setProperty('--nav-bottom', nb + 'px');
        }
      }
      function schedule() {
        if (raf) return;
        raf = requestAnimationFrame(function () { raf = 0; set(); });
      }
      set();
      window.addEventListener('resize', schedule);
      window.addEventListener('orientationchange', function () { setTimeout(set, 300); });
      window.addEventListener('load', set);
      if (vv) {
        vv.addEventListener('resize', schedule);
        vv.addEventListener('scroll', schedule);
      }
    })();
  </script>

  <!-- רקע טורקיז קבוע + סגנון מסך הטעינה - חייב להיות ב-<head> כדי שיוחל לפני כל רינדור -->
  <style>
    :root { --app-height: 100vh; }
    @supports (height: 100dvh) { :root { --app-height: 100dvh; } }
    html, body {
      margin: 0;
      padding: 0;
      background: #14B8A6;
      min-height: 100%;
    }
    /* רקע #root נשאר טורקיז גם אחרי טעינה - אם ה-JS מת כשהאפליקציה ב-background
       וחוזרים, הלקוח יראה את הצבע של האפליקציה ולא מסך לבן ריק. */
    #root {
      min-height: 100vh;
      min-height: var(--app-height, 100dvh);
      background: #14B8A6;
    }
    /* כשהתמה נטענת ולוקחת פיקוד, מסירים את הרקע מתחת התוכן */
    body.app-loaded #root {
      background: var(--app-bg, transparent);
    }

    /* ===== מסך טעינה ראשוני ===== */
    /* CSS כאן ב-<head> ולא בתוך ה-div כדי שהסגנון יוחל מהפריים הראשון,
       לפני שהדפדפן מספיק לצייר - כך אין מסך לבן גם לשבריר שנייה */
    #initial-loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #14B8A6;
      z-index: 9999;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    /* הילה+לוגו לגמרי סטטיים בכוונה - בלי שום pulse/float. האייקון כולו
       לא זז לעולם; רק הוו עצמו (למטה) מקבל אנימציה משלו, ורק אחרי דיליי. */
    .splash-halo {
      position: absolute;
      width: 280px; height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 70%);
    }
    .splash-logo-wrap {
      position: relative;
      width: 96px; height: 96px;
      filter: drop-shadow(0 12px 28px rgba(0,0,0,0.22));
    }
    .splash-logo { width: 100%; height: 100%; display: block; }
    /* הוו: 2 השניות הראשונות בדיוק כמו האייקון האמיתי - מצויר במלואו,
       בלי שום תזוזה/הבהוב (stroke-dashoffset:0 זו ברירת המחדל, לפני
       שהאנימציה בכלל מתחילה - animation-delay 2s). רק אחרי זה מתחיל
       לולאה שמוחקת ומציירת את הוו מחדש - "חי" בלי שהאייקון כולו זז. */
    .splash-check {
      stroke-dasharray: 130;
      stroke-dashoffset: 0;
      animation: checkRedraw 2.6s ease-in-out 2s infinite;
    }
    @keyframes checkRedraw {
      0%   { stroke-dashoffset: 0; }
      20%  { stroke-dashoffset: 130; }
      25%  { stroke-dashoffset: 130; }
      70%  { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    .splash-brand {
      margin-top: 28px;
      color: #fff;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.18);
      animation: fadeUp 0.6s ease-out 0.1s both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .splash-error {
      display: none;
      position: absolute; bottom: 16%;
      text-align: center; padding: 0 24px;
      animation: fadeUp 0.4s ease-out both;
    }
    .splash-error .err-title { color: #fff; font-size: 14px; margin: 0 0 6px; font-weight: 600; }
    .splash-error .err-detail { color: rgba(255,255,255,0.7); font-size: 11px; margin: 0 0 14px; direction: ltr; word-break: break-all; }
    .splash-error .err-btn {
      background: #fff; color: #0D9488; border: none;
      padding: 12px 28px; border-radius: 12px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    }
  </style>
  <!--
    הוסר (היה כאן "v2.0 migration": ביטול רישום SW ישנים + ניקוי caches +
    localStorage.clear() + reload בלתי-מותנה, מ-158e1ce1, פברואר, בשביל
    תקלה חד-פעמית וארוכת-זמן-פתורה של אותה תקופה - "only runs on first
    visit after deploy" לפי הודעת ה-commit המקורית).

    זה בדיוק אותה משפחת באג שכל התיקונים האחרונים (App.tsx, router/index.tsx,
    main.tsx, ErrorBoundary.tsx, useServiceWorker.ts) הוסרו/תוקנו בגללה:
    location.reload()/localStorage.clear() בלתי-מותנים, מוקדם מאוד בטעינת
    הדף, בלי שום בדיקה אם יש בקשת רשת פעילה. localStorage.clear() כאן
    בפרט היה יכול למחוק טוקנים תקפים לגמרי אם הסקריפט הזה (שרץ בכל טעינת
    דף כל עוד sw_migrated_v2 לא הוגדר) קרה תוך כדי/אחרי login מוצלח -
    התהליך כולו (getRegistrations → unregister → caches.keys → caches.delete)
    הוא שרשרת אסינכרונית שיכולה לקחת כמה שניות בפועל, בדיוק תואם לדיווח
    "כמה שניות אחרי הפתיחה השנייה". רישום SW מנוהל היום לגמרי אחרת
    (useServiceWorker.ts, רישום ידני + injectRegister:false) - המיגרציה
    הזו לא רלוונטית יותר לאף משתמש שרץ על גרסה עדכנית - useServiceWorker.ts
    כבר קורא ל-register() עם ה-scriptURL הנוכחי בכל טעינה, וזה מספיק כדי
    שרישום ישן/לא-תואם יוחלף דרך מחזור החיים הרגיל של Service Worker
    (installing → waiting → activate), בלי שום קוד נוסף כאן.
  -->

  <!--
    לוג בלבד, בלי reload - זה היה כנראה השורש האמיתי של "ה-PWA נסגר וחוזר
    למסך הבית של iOS כמה שניות אחרי הפתיחה השנייה".

    הקובץ הזה (index.html) לא נכלל באף grep/audit קודם של reload/href/replace
    שנעשה תחת client/src/** - כי הוא סטטי, מחוץ ל-bundle. השדרוג הזה נשאר
    כאן מגרסה ישנה, לפני שכל לוגיקת ה-reload-על-SW_ACTIVATED "עברה" ל-React
    (router/index.tsx) - אבל אף אחד לא הסיר את הגרסה המקורית כאן. בזמן
    שכל שאר הקוד (App.tsx, router/index.tsx, main.tsx, ErrorBoundary.tsx,
    ה-vite-plugin-pwa עצמו) עבר תיקון יסודי כדי לא לרענן אף פעם באופן
    בלתי-מותנה, הסקריפט הגולמי הזה המשיך להאזין לאותה הודעה בדיוק
    (SW_ACTIVATED, שנשלחת מ-sw.ts:activate) ולעשות location.reload() מיידי
    ובלתי-מותנה - בדיוק ברגע שכל שאר הקוד תוכנן להימנע ממנו.

    location.reload() לא-מבוקר בהקשר standalone PWA ב-iOS, בדיוק ברגע
    שה-WKWebView עדיין באמצע restore אחרי פתיחה שנייה, הוא ההסבר הסביר
    ביותר ל"האפליקציה נסגרת וחוזרת למסך הבית" (לא סתם מסך login) - לא
    reload רגיל בתוך ה-PWA אלא קריסה/סגירה של ה-WKWebView עצמו.

    במקום להסיר את המאזין לגמרי (ואיבוד יכולת אבחון), משאירים אותו כ-log
    בלבד - אם ההודעה עדיין מגיעה, נדע דרך sb_crash_log (ראו crashLog.ts)
    בלי לגרום לשום reload.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', function(e) {
        if (e.data && e.data.type === 'SW_ACTIVATED') {
          try {
            var raw = localStorage.getItem('sb_crash_log');
            var log = raw ? JSON.parse(raw) : { start: Date.now(), entries: [] };
            log.entries.push({ t: Date.now() - log.start, msg: '[index.html] SW_ACTIVATED received (no reload - fixed)' });
            if (log.entries.length > 150) log.entries.shift();
            localStorage.setItem('sb_crash_log', JSON.stringify(log));
          } catch (err) { /* לא קריטי */ }
          console.log('[index.html] SW_ACTIVATED received - no longer reloading (see comment above)');
        }
      });
    }
  </script>
  </head>
  <body>
    <!-- מסך טעינה ראשוני - מינימליסטי ונקי -->
    <!-- style inline כגיבוי מוחלט: מבטיח תצוגה מיידית גם לפני שהדפדפן
         הספיק להחיל את ה-<style> שב-<head> (edge case בחלק מהדפדפנים). -->
    <div id="initial-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#14B8A6;z-index:9999;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
      <!-- Halo עדין מאחורי הלוגו - vibe של "פועם" בלי עומס ויזואלי -->
      <div class="splash-halo"></div>

      <!-- לוגו מרכזי - הסל. ה-stroke הזוהר זז סביבו = הטעינה -->
      <div class="splash-logo-wrap">
        <svg class="splash-logo" viewBox="0 0 512 512" aria-hidden="true">
          <!-- זהה ל-favicon.svg - לוגו אחיד בכל האפליקציה -->
          <defs>
            <linearGradient id="splashBg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#14B8A6"/>
              <stop offset="100%" stop-color="#0D9488"/>
            </linearGradient>
            <filter id="splashShadow">
              <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/>
            </filter>
          </defs>
          <rect width="512" height="512" rx="112" fill="url(#splashBg)"/>
          <g filter="url(#splashShadow)">
            <path d="M150 228 L176 368 C178 380 187 392 200 392 L312 392 C325 392 334 380 336 368 L362 228 C363 222 359 217 353 217 L159 217 C153 217 149 222 150 228 Z" fill="white"/>
            <path d="M192 210 C192 178 210 142 256 142 C302 142 320 178 320 210" stroke="white" stroke-width="22" fill="none" stroke-linecap="round"/>
          </g>
          <!-- וי - 2 שניות ראשונות זהה לאייקון האמיתי, אחר כך נמחק/מצויר
               מחדש בלולאה (ראו .splash-check למעלה) -->
          <path class="splash-check" d="M216 286 L248 318 L304 258" stroke="#14B8A6" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- שם המותג - גדול, נקי -->
      <div class="splash-brand">Smart Basket</div>

      <!-- Fallback - מוצג רק אחרי 15ש' או error -->
      <div id="load-error" class="splash-error">
        <p class="err-title">הטעינה נכשלה</p>
        <p id="error-text" class="err-detail"></p>
        <button onclick="location.href='/clear.html'" class="err-btn">נסה שוב</button>
      </div>

      <script>
        // Error handler גלובלי - שגיאות ריצה בתוך JS שכבר רץ (window.onerror
        // *לא* נורה על כשל טעינת <script> עצמו - זה resource error, לא
        // exception - ראו הandler הנפרד למטה).
        window.onerror = function(msg, url, line) {
          var error = document.getElementById('load-error');
          var errorText = document.getElementById('error-text');
          if (error && errorText) {
            errorText.textContent = msg + ' (line ' + line + ')';
            error.style.display = 'block';
          }
          return false;
        };
        setTimeout(function() {
          var error = document.getElementById('load-error');
          if (error) error.style.display = 'block';
        }, 15000);

        // ===== כשל טעינת ה-entry script עצמו ("Importing a module script
        // failed" ב-Safari / "Failed to fetch dynamically imported module"
        // בדפדפנים אחרים) =====
        // main.tsx מטפל כבר ב-vite:preloadError (chunk ישן אחרי דיפלוי
        // בניווט בתוך האפליקציה, אחרי טעינה מוצלחת) - אבל אם ה-<script
        // type="module"> הראשי עצמו (למטה, /src/main.tsx בבנייה) נכשל
        // בטעינה - שום JS שלנו עוד לא רץ בכלל, אז שום listener במקום אחר
        // לא יכול לתפוס את זה. חייב handler מוקדם כזה, כאן, לפני תג
        // ה-module. שגיאת טעינת <script> היא resource error (Event, לא
        // ErrorEvent) - לא מבעבעת ולא נתפסת ע"י window.onerror; רק
        // capturing-phase addEventListener('error', fn, true) תופס אותה.
        // רענון בודד בלבד (sessionStorage, פר-טאב) - כמו ב-main.tsx,
        // כדי לא להיכנס ללולאת רענון אם השגיאה אמיתית ולא chunk/רשת חולפת.
        window.addEventListener('error', function(e) {
          var t = e.target;
          if (!t || t.tagName !== 'SCRIPT' || t.type !== 'module') return;
          var now = Date.now();
          var last = 0;
          try { last = Number(sessionStorage.getItem('sb_entry_reload_at') || 0); } catch (err) {}
          if (now - last < 20000) return;
          try { sessionStorage.setItem('sb_entry_reload_at', String(now)); } catch (err) {}
          location.reload();
        }, true);
      </script>

      <!-- סגנון ה-splash הועבר ל-<head> -->
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
